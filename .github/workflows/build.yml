name: Build EternalClub APK

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EternalClub project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download current Keiyoushi build framework
        run: git clone --depth 1 https://github.com/keiyoushi/extensions-source.git upstream

      - name: Overlay EternalClub source module
        run: |
          mkdir -p upstream/src/en/eternalclub
          cp -R src/en/eternalclub/. upstream/src/en/eternalclub/

      - name: Configure single-module build
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("settings.gradle.kts")
          content = path.read_text()
          old = "loadAllIndividualExtensions()"
          new = 'loadIndividualExtension("en", "eternalclub")'
          if old not in content:
              raise SystemExit("Could not find the upstream extension-loading declaration.")
          path.write_text(content.replace(old, new, 1))
          PY

      - name: Format Kotlin source
        working-directory: upstream
        run: ./gradlew :src:en:eternalclub:spotlessApply --no-daemon

      - name: Build standalone debug APK
        working-directory: upstream
        run: ./gradlew :src:en:eternalclub:assembleDebug --no-daemon
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EternalClub-debug-apk
          path: upstream/src/en/eternalclub/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
